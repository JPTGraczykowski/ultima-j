[package]
name = "ultima-j"
version = "0.1.0"
edition = "2024"
description = "A clone of the 1992 first-person dungeon RPG Ultima Underworld, with a software renderer and procedurally generated art in the style of the original."

[dependencies]
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
